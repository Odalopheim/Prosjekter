<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kjøp gavekort</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div class="brand">
                <span class="brand__eyebrow">Kjøp</span>
                <h1 class="brand__title">Opprett nytt gavekort</h1>
                <p class="brand__subtitle">Velg beløp og send skjemaet til backend.</p>
            </div>
            <a class="back-link" href="index.html">Tilbake til hovedsiden</a>
        </header>

        <section class="grid">
            <div class="card card--wide stack">
                <form id="purchase-form">
                    <div class="form-group">
                        <label for="amount">Beløp</label>
                        <input type="number" id="amount" min="1" placeholder="Skriv inn beløpet" required>
                    </div>

                    <div class="actions">
                        <button type="submit">Kjøp gavekort</button>
                    </div>
                </form>

                <p class="hint">Når du sender inn skjemaet, vil JavaScript sende beløpet til Flask-API-et.</p>
                <div id="purchase-result" class="result">Her vises svaret fra backend.</div>
            </div>
        </section>
    </main>

    <script src="js/kjøp.js"></script>
</body>
</html>
